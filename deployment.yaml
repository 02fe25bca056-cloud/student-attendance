apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-attendance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-attendance
  template:
    metadata:
      labels:
        app: student-attendance
    spec:
      containers:
        - name: attendance
          image: student-attendance:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: attendance-service
spec:
  selector:
    app: student-attendance
  ports:
    - port: 5000
      targetPort: 5000+
